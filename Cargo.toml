[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
ammonia = "4.1.4"
anyhow = "1.0.104"
async-trait = "0.1.92"
axum = "0.8.9"
clap = { version = "4.6.6", features = ["derive"] }
console_error_panic_hook = "0.1.7"
console_log = "1.1.0"
crossterm = { version = "0.29.0", features = ["event-stream"] }
dashmap = "6.2.1"
dunce = "1.0.5"
fastrand = "2.5.0"
figment = { version = "0.10.19", features = ["toml", "env"] }
futures = "0.3.34"
gloo-net = "0.7.0"
governor = "0.10.4"
hickory-resolver = "0.26.1"
html2text = "0.17.1"
http = "1.5.0"
ignore = "0.4.33"
ipnet = "2.12.1"
leptos = { version = "0.8.20", features = ["csr"] }
leptos_meta = "0.8.6"
leptos_router = "0.8.15"
log = "0.4.34"
mime_guess = "2.0.5"
notify = "8.2.0"
pulldown-cmark = "0.13.4"
ratatui = "0.30.2"
ratatui-textarea = "0.9.2"
readability = "0.3.0"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "gzip"] }
rig = { version = "0.41.0", default-features = false, features = ["derive"] }
rust-embed = "8.12.0"
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
similar = "2.7.0"
slotmap = "1.1.1"
synoptic = "2.2.9"
syntect = "5.3.0"
tempfile = "3.27.0"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "fs", "time"] }
tokio-stream = "0.1.19"
tokio-util = "0.7.19"
toml = "1.1.4"
tower = { version = "0.5.3", features = ["util"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ulid = "3.0.0"
url = "2.5.8"
wasm-bindgen = "0.2.128"
wasm-bindgen-futures = "0.4.78"
wasm-bindgen-test = "0.3.78"
web-sys = { version = "0.3.105", features = ["Document", "Window"] }
wiremock = "0.6.5"

mate-core = { path = "crates/mate-core" }
mate-specviz-server = { path = "crates/mate-specviz-server" }
mate-tool-agent = { path = "crates/mate-tool-agent" }
mate-tool-api = { path = "crates/mate-tool-api" }
mate-tool-fs = { path = "crates/mate-tool-fs" }
mate-tool-http = { path = "crates/mate-tool-http" }
mate-tool-mcp = { path = "crates/mate-tool-mcp" }
mate-tool-skills = { path = "crates/mate-tool-skills" }
mate-tui = { path = "crates/mate-tui" }

# Shrink the specviz client wasm bundle; host crates are unaffected.
[profile.release.package.mate-specviz-client]
opt-level = "z"

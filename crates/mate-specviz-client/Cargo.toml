[package]
name = "mate-specviz-client"
version.workspace = true
edition.workspace = true

# Every dependency is wasm-only: on the host this crate compiles to nothing, so
# `cargo clippy --workspace` / `cargo nextest run --workspace` never pull the
# Leptos stack in. The real build is `trunk build` (see Trunk.toml), linted with
# `cargo clippy -p mate-specviz-client --target wasm32-unknown-unknown`.
[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = { workspace = true }
console_log = { workspace = true }
futures = { workspace = true }
gloo-net = { workspace = true }
leptos = { workspace = true }
leptos_meta = { workspace = true }
leptos_router = { workspace = true }
log = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = { workspace = true }
web-sys = { workspace = true }

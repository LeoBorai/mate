[graph]
targets = []

[advisories]
version = 2
yanked = "deny"
ignore = [
    "RUSTSEC-2024-0436", # paste — unmaintained, no fixed upgrade, transitive via ratatui 0.29 (tui-textarea)
    "RUSTSEC-2025-0134", # rustls-pemfile — unmaintained, no fixed upgrade, transitive via reqwest 0.11 (readability)
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
    "CC0-1.0",
    "BSL-1.0",
    "0BSD",
    "OpenSSL",
    "Unlicense",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }},wasm32-unknown-unknown

      - uses: taiki-e/install-action@v2
        with:
          tool: trunk@0.21

      # The spec viewer's UI is embedded into `mate` at compile time; build it
      # first and refuse to ship a binary that would serve the "UI not built"
      # page instead.
      - name: Build specviz UI
        working-directory: crates/mate-specviz-client
        shell: bash
        run: |
          set -euo pipefail
          trunk build --release
          test -f dist/index.html || { echo "specviz UI bundle missing: dist/index.html"; exit 1; }

      - run: cargo build --release --locked -p mate-cli --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          staging="mate-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir -p "$staging"
          cp "target/${{ matrix.target }}/release/mate" "$staging/"
          cp README.md "$staging/"
          tar -czf "${staging}.tar.gz" "$staging"

      - uses: actions/upload-artifact@v4
        with:
          name: mate-${{ matrix.target }}
          path: mate-${{ github.ref_name }}-${{ matrix.target }}.tar.gz

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
          generate_release_notes: true
